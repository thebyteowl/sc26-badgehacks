<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supercon 2026 Badge Camera</title>
  <style>
    :root {
      --bg: #111318;
      --card: #1c2029;
      --border: #2e3444;
      --text: #f0f3f8;
      --muted: #9aa4b8;
      --accent: #e63946;
      --accent-hover: #ff4d5a;
      --ok: #2ec4b6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 920px;
      margin-inline: auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6c757d;
    }
    .dot.online { background: var(--ok); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary {
      background: var(--card);
      border: 1px solid var(--border);
    }
    button.secondary:hover:not(:disabled) { background: #262c38; }
    label.toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
    }
    .progress-wrap {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #0d0f13;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--ok);
      transition: width 0.08s linear;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .photo-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .photo-card img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      background: #fff;
      border: 1px solid var(--border);
    }
    .photo-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .photo-actions {
      display: flex;
      gap: 8px;
    }
    .photo-actions a, .photo-actions button {
      color: #fff;
      background: #2b3242;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .empty {
      text-align: center;
      padding: 36px 18px;
      color: var(--muted);
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 12px;
      grid-column: 1 / -1;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Supercon 2026 Badge Camera</h1>
    <div class="status-pill">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </header>

  <div class="controls">
    <button id="connectBtn">Connect to Badge (BLE)</button>
    <button id="snapBtn" class="secondary" disabled>Snap Photo</button>
    <button id="flashBtn" class="secondary" disabled>Toggle Flash</button>
    <label class="toggle">
      <input type="checkbox" id="autoDownload" checked />
      Auto-save photos
    </label>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div id="progressLabel">Receiving photo...</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <div id="gallery" class="gallery">
    <div class="empty" id="emptyHint">
      Open the <strong>Camera</strong> app on your badge, tap <strong>Connect to Badge (BLE)</strong> above, then press <strong>A (Snap)</strong> on the badge or tap <strong>Snap Photo</strong>!
    </div>
  </div>

  <script>
    const SVC_UUID  = 'ba6e0001-2026-4861-636b-616461790000';
    const CHR_UUID  = 'ba6e0002-2026-4861-636b-616461790000';
    const SVC_UUID2 = 'ba6e0010-2026-4861-636b-616461790000';
    const CHR_UUID2 = 'ba6e0011-2026-4861-636b-616461790000';

    const BADGE_W = 960;
    const BADGE_VH = 624;
    const IMG_BYTES = (BADGE_W * BADGE_VH) / 8;

    const connectBtn = document.getElementById('connectBtn');
    const snapBtn = document.getElementById('snapBtn');
    const flashBtn = document.getElementById('flashBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const progressWrap = document.getElementById('progressWrap');
    const progressLabel = document.getElementById('progressLabel');
    const progressFill = document.getElementById('progressFill');
    const gallery = document.getElementById('gallery');
    const emptyHint = document.getElementById('emptyHint');
    const autoDownload = document.getElementById('autoDownload');

    let bleDevice = null;
    let bleChar = null;

    let rxType = 0;
    let rxTotal = 0;
    let rxBuf = null;
    let rxPos = 0;

    function setConnected(online, name) {
      statusDot.classList.toggle('online', online);
      statusText.textContent = online ? `Connected (${name})` : 'Disconnected';
      connectBtn.textContent = online ? 'Disconnect' : 'Connect to Badge (BLE)';
      snapBtn.disabled = !online;
      flashBtn.disabled = !online;
    }

    function decodeRleMono(src, srcLen) {
      const out = new Uint8Array(IMG_BYTES);
      let si = 0, di = 0;
      while (si < srcLen && di < IMG_BYTES) {
        const c = src[si++];
        if (c < 128) {
          const run = c + 1;
          for (let i = 0; i < run && si < srcLen && di < IMG_BYTES; i++) {
            out[di++] = src[si++];
          }
        } else {
          const run = 257 - c;
          const val = src[si++];
          for (let i = 0; i < run && di < IMG_BYTES; i++) {
            out[di++] = val;
          }
        }
      }
      return out;
    }

    function renderMonoToCanvas(plane) {
      const canvas = document.createElement('canvas');
      canvas.width = BADGE_W;
      canvas.height = BADGE_VH;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(BADGE_W, BADGE_VH);
      const d = imgData.data;

      for (let i = 0; i < BADGE_W * BADGE_VH; i++) {
        const bit = (plane[i >> 3] >> (7 - (i & 7))) & 1;
        const p = i * 4;
        if (bit) {
          d[p] = 28; d[p + 1] = 20; d[p + 2] = 24; d[p + 3] = 255;
        } else {
          d[p] = 246; d[p + 1] = 244; d[p + 2] = 238; d[p + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    function addPhotoCard(blob, label, filename) {
      if (emptyHint) emptyHint.style.display = 'none';
      const url = URL.createObjectURL(blob);
      const card = document.createElement('div');
      card.className = 'photo-card';

      const img = document.createElement('img');
      img.src = url;
      img.alt = label;

      const meta = document.createElement('div');
      meta.className = 'photo-meta';
      const span = document.createElement('span');
      span.textContent = `${label} • ${new Date().toLocaleTimeString()}`;

      const actions = document.createElement('div');
      actions.className = 'photo-actions';

      const dl = document.createElement('a');
      dl.href = url;
      dl.download = filename;
      dl.textContent = 'Save';
      actions.appendChild(dl);

      if (navigator.canShare) {
        const file = new File([blob], filename, { type: blob.type });
        if (navigator.canShare({ files: [file] })) {
          const shareBtn = document.createElement('button');
          shareBtn.textContent = 'Share';
          shareBtn.addEventListener('click', () => {
            navigator.share({ files: [file], title: label }).catch(() => {});
          });
          actions.appendChild(shareBtn);
        }
      }

      meta.appendChild(span);
      meta.appendChild(actions);
      card.appendChild(img);
      card.appendChild(meta);
      gallery.prepend(card);

      if (autoDownload.checked) {
        dl.click();
      }
    }

    function onNotification(event) {
      const v = new Uint8Array(event.target.value.buffer, event.target.value.byteOffset, event.target.value.byteLength);

      // Start header: ['P', 'H', 'O', 'T', type, 0, len_lo, len_hi]
      if (v.length === 8 && v[0] === 0x50 && v[1] === 0x48 && v[2] === 0x4F && v[3] === 0x54) {
        rxType = v[4];
        rxTotal = v[6] | (v[7] << 8);
        rxBuf = new Uint8Array(rxTotal);
        rxPos = 0;
        progressWrap.style.display = 'block';
        progressFill.style.width = '0%';
        progressLabel.textContent = `Receiving ${rxType === 1 ? 'JPEG' : '1-bit Badge'} photo (0 / ${rxTotal} B)...`;
        return;
      }

      // End packet: ['D', 'O', 'N', 'E', csum, type]
      if (v.length === 6 && v[0] === 0x44 && v[1] === 0x4F && v[2] === 0x4E && v[3] === 0x45) {
        progressWrap.style.display = 'none';
        if (!rxBuf || rxPos === 0) return;

        const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const bytes = rxBuf.subarray(0, rxPos);
        if (rxType === 1) {
          const blob = new Blob([bytes], { type: 'image/jpeg' });
          addPhotoCard(blob, `ESP32-CAM JPEG (${rxPos} B)`, `badge-cam-${ts}.jpg`);
        } else if (rxType === 2) {
          const plane = decodeRleMono(bytes, rxPos);
          const canvas = renderMonoToCanvas(plane);
          canvas.toBlob((blob) => {
            addPhotoCard(blob, `1-Bit Badge (960×624)`, `badge-1bit-${ts}.png`);
          }, 'image/png');
        }
        rxBuf = null;
        return;
      }

      // Data chunk: [seq_lo, seq_hi, payload...]
      if (rxBuf && v.length > 2) {
        const pay = v.subarray(2);
        const n = Math.min(pay.length, rxTotal - rxPos);
        rxBuf.set(pay.subarray(0, n), rxPos);
        rxPos += n;
        const pct = Math.min(100, Math.round((rxPos * 100) / rxTotal));
        progressFill.style.width = `${pct}%`;
        progressLabel.textContent = `Receiving ${rxType === 1 ? 'JPEG' : '1-bit Badge'} photo (${rxPos} / ${rxTotal} B, ${pct}%)...`;
      }
    }

    connectBtn.addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        alert(
          'Web Bluetooth (navigator.bluetooth) is not available.\n\n' +
          '• Use Chrome on Android (or Bluefy on iOS).\n' +
          '• Make sure the page is served over HTTPS (or localhost), or enable chrome://flags/#unsafely-treat-insecure-origin-as-secure for this IP.'
        );
        return;
      }
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        return;
      }
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SVC_UUID] }, { services: [SVC_UUID2] }, { namePrefix: 'Badge-' }],
          optionalServices: [SVC_UUID, SVC_UUID2],
        });
        bleDevice.addEventListener('gattserverdisconnected', () => setConnected(false));
        const server = await bleDevice.gatt.connect();
        try {
          const service = await server.getPrimaryService(SVC_UUID);
          bleChar = await service.getCharacteristic(CHR_UUID);
        } catch (_) {
          const service = await server.getPrimaryService(SVC_UUID2);
          bleChar = await service.getCharacteristic(CHR_UUID2);
        }
        await bleChar.startNotifications();
        bleChar.addEventListener('characteristicvaluechanged', onNotification);
        setConnected(true, bleDevice.name || 'Badge');
      } catch (err) {
        console.error(err);
        alert('Bluetooth connection failed: ' + err.message);
      }
    });

    snapBtn.addEventListener('click', async () => {
      if (!bleChar) return;
      await bleChar.writeValueWithoutResponse(new Uint8Array([0x53])); // 'S'
    });

    flashBtn.addEventListener('click', async () => {
      if (!bleChar) return;
      await bleChar.writeValueWithoutResponse(new Uint8Array([0x46])); // 'F'
    });
  </script>
</body>
</html>
